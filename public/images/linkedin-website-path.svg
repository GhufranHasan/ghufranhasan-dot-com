      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 1 0 0 0.45 0 0 1 0 0.08 0 0 0 0.62 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="microGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" stroke="white" stroke-opacity="0.045" stroke-width="1"/>
