<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12051F"/>
      <stop offset="0.48" stop-color="#240537"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="96" y1="171" x2="1085" y2="587" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB25A"/>
      <stop offset="0.44" stop-color="#FF7A18"/>
      <stop offset="0.72" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#44D7FF"/>
    </linearGradient>
    <linearGradient id="line" x1="167" y1="384" x2="1038" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A00"/>
      <stop offset="0.48" stop-color="#FF5CCB"/>
      <stop offset="1" stop-color="#44D7FF"/>
    </linearGradient>
    <radialGradient id="glitterOrange" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFE0B2"/>
      <stop offset="0.34" stop-color="#FF8A00" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glitterPink" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFD6F5"/>
      <stop offset="0.36" stop-color="#FF4FD8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
